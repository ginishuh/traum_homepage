extends: ['@commitlint/config-conventional']
rules:
  subject-case:
    - 0
    - never
    - []
  subject-full-stop:
    - 2
    - never
  header-max-length:
    - 2
    - always
    - 200
  # Relax line-length constraints to avoid noisy failures on descriptive footers
  footer-max-line-length:
    - 0
    - always
    - Infinity
  body-max-line-length:
    - 0
    - always
    - Infinity
  type-enum:
    - 2
    - always
    - [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, content, post, blog]
