name: Deploy OAuth (compose build + up)

on:
  push:
    branches: [ main ]
    paths:
      - 'traum_blog/oauth/**'
      - 'traum_blog/.env.example'
      - 'traum_blog/docker-compose.yml'
  workflow_dispatch:

concurrency:
  group: deploy-oauth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEST: /srv/traum_homepage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          set -euo pipefail
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is not set in repository Actions secrets";
              missing=$((missing+1))
            fi
          done
          if [ -z "${DEPLOY_SSH_PORT:-}" ]; then
            echo "info: DEPLOY_SSH_PORT not set, defaulting to 22";
          fi
          if [ $missing -gt 0 ]; then
            echo "Some required secrets are missing. Add them in Settings → Secrets and variables → Actions.";
            exit 1;
          fi

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          : "${DEPLOY_SSH_PORT:=22}"
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rsync oauth files to VPS
        run: |
          : "${DEPLOY_SSH_PORT:=22}"
          rsync -az \
            --rsync-path="mkdir -p '$DEST/traum_blog/oauth' && rsync" \
            -e "ssh -p $DEPLOY_SSH_PORT -o StrictHostKeyChecking=no" \
            traum_blog/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEST/traum_blog/" \
            && rsync -az \
            -e "ssh -p $DEPLOY_SSH_PORT -o StrictHostKeyChecking=no" \
            traum_blog/oauth/ "$DEPLOY_USER@$DEPLOY_HOST:$DEST/traum_blog/oauth/"

      - name: Build & restart oauth
        run: |
          : "${DEPLOY_SSH_PORT:=22}"
          ssh -p "$DEPLOY_SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -se -c 'set -euo pipefail; \
              cd $DEST/traum_blog; \
              if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then \
                docker compose build oauth && docker compose up -d oauth; \
              elif command -v docker-compose >/dev/null 2>&1; then \
                docker-compose build oauth && docker-compose up -d oauth; \
              else echo docker\\ compose not found >&2; exit 1; fi; \
              sleep 2; docker ps --format \"table {{.Names}}\t{{.Image}}\t{{.Status}}\" | sed -n 1,20p'"

